name: Apply updater counter fix

on:
  push:
    branches:
      - fix/updater-preserve-file-modes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/updater-preserve-file-modes

      - name: Apply targeted patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text()

          marker = '  "tests/test-cog-update-mode-drift.sh"\n'
          addition = marker + '  "tests/test-cog-update-force.sh"\n'
          if '  "tests/test-cog-update-force.sh"\n' not in text:
              if marker not in text:
                  raise SystemExit('FRAMEWORK_FILES marker not found')
              text = text.replace(marker, addition, 1)

          updated_count = text.count('((updated++))')
          skipped_count = text.count('((skipped++))')
          if updated_count != 5 or skipped_count != 3:
              raise SystemExit(
                  f'unexpected counter occurrences: updated={updated_count} skipped={skipped_count}'
              )

          text = text.replace('((updated++))', 'updated=$((updated + 1))')
          text = text.replace('((skipped++))', 'skipped=$((skipped + 1))')
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh
          git diff --cached --check
          git commit -m "fix: avoid errexit on updater counters"
          git push origin HEAD:fix/updater-preserve-file-modes
