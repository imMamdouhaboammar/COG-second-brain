name: Apply harness bootstrap fix

on:
  push:
    branches:
      - fix/harness-bootstrap-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/harness-bootstrap-contract

      - name: Sync Agent Plugins mirror
        run: bash scripts/build-agent-plugin.sh

      - name: Remove dead harness references and track regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('WORKFLOW.md')
          text = workflow.read_text(encoding='utf-8')
          backlog_row = '| Harness backlog | `04-projects/harness/BACKLOG.md` |\n'
          text = text.replace(backlog_row, '')

          old_install = '''## Install

          ```bash
          bash .claude/lib/install-harness.sh
          bash .claude/lib/install-harness.sh --check
          ```'''.replace('          ', '')
          new_validation = '''## Validate the shipped harness

          The harness ships as part of COG; there is no separate installer. Validate the checked-out framework with:

          ```bash
          bash tests/test-harness-assets.sh
          bash tests/test-harness-bootstrap-contract.sh
          bash scripts/validate-agent-surface.sh
          ```'''.replace('          ', '')
          if old_install in text:
              text = text.replace(old_install, new_validation, 1)
          elif new_validation not in text:
              raise SystemExit('WORKFLOW install block not found')
          workflow.write_text(text, encoding='utf-8')

          updater = Path('cog-update.sh')
          text = updater.read_text(encoding='utf-8')
          marker = '  "tests/test-harness-assets.sh"\n'
          addition = '  "tests/test-harness-bootstrap-contract.sh"\n'
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('cog-update harness test marker not found exactly once')
              text = text.replace(marker, marker + addition, 1)
          if '  "04-projects/harness/ultragoals.md"\n' in text:
              raise SystemExit('mutable ultragoal registry must not be in FRAMEWORK_FILES')
          updater.write_text(text, encoding='utf-8')
          PY

      - name: Commit guarded edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKFLOW.md cog-update.sh skills/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: align harness bootstrap contract"
            git push origin HEAD:fix/harness-bootstrap-contract
          fi

# trigger: guarded patch after workflow exists on branch
