name: Apply report review fixes

on:
  push:
    branches:
      - fix/checkpoint-evidence-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/checkpoint-evidence-integrity

      - name: Apply guarded edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updater = Path('cog-update.sh')
          text = updater.read_text(encoding='utf-8')
          script_marker = '  "scripts/validate-agent-surface.sh"\n'
          script_line = '  "scripts/render-harness-report.py"\n'
          if script_line not in text:
              if text.count(script_marker) != 1:
                  raise SystemExit('updater script marker not found exactly once')
              text = text.replace(script_marker, script_marker + script_line, 1)
          test_marker = '  "tests/test-harness-assets.sh"\n'
          test_line = '  "tests/test-harness-report-renderer.py"\n'
          if test_line not in text:
              if text.count(test_marker) != 1:
                  raise SystemExit('updater test marker not found exactly once')
              text = text.replace(test_marker, test_marker + test_line, 1)
          updater.write_text(text, encoding='utf-8')

          workflow = Path('WORKFLOW.md')
          text = workflow.read_text(encoding='utf-8')
          old = '- **`full` lane / big task:** generate an HTML rollup from `04-projects/harness/templates/report.html` → `04-projects/harness/runs/<id>/report.html`, filled from `criteria.md` + `evidence/ledger.md` (criteria, AC traceability, verifier verdicts, post-condition observations). Self-contained; `SendUserFile` it or publish as an Artifact. Skip for `normal`/`tiny`.'
          new = '- **`full` lane / big task:** write structured report JSON, then render with `python3 scripts/render-harness-report.py --data <report-data.json> --output 04-projects/harness/runs/<id>/report.html`. Never substitute raw evidence or project text into HTML by hand; the renderer escapes text and accepts only validated base64 image media. Skip for `normal`/`tiny`.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('WORKFLOW report instruction marker not found')
          workflow.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '- Closed-loop and ultragoal flows now ship the `SPEC-template.md` and self-contained `report.html` assets they already reference.\n'
          addition = '- Harness HTML reports now render from structured JSON through `scripts/render-harness-report.py`; text fields are HTML-escaped and media is restricted to validated base64 image data URIs.\n'
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('CHANGELOG v3.10.3 marker not found exactly once')
              text = text.replace(marker, marker + addition, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Commit guarded edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cog-update.sh WORKFLOW.md CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: wire safe harness report rendering"
            git push origin HEAD:fix/checkpoint-evidence-integrity
          fi
