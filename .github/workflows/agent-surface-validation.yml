name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Prepare v3.10.1 contribution metadata
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'RELEASEPY'
          from pathlib import Path

          old_version = '3.10.0'
          new_version = '3.10.1'

          version_file = Path('COG-VERSION')
          if version_file.read_text(encoding='utf-8').strip() == old_version:
              version_file.write_text(new_version + '\n', encoding='utf-8')

          for name in (
              '.claude-plugin/plugin.json',
              '.cursor-plugin/plugin.json',
              'plugin.json',
              'marketplace-entry.json',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = f'"version": "{old_version}"'
              new = f'"version": "{new_version}"'
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          marketplace = Path('.github/MARKETPLACE.md')
          marketplace_text = marketplace.read_text(encoding='utf-8')
          old_marketplace = f'Current packaged version: **{old_version}**'
          new_marketplace = f'Current packaged version: **{new_version}**'
          if marketplace_text.count(old_marketplace) != 1:
              raise SystemExit('marketplace packaged-version marker not found exactly once')
          marketplace.write_text(
              marketplace_text.replace(old_marketplace, new_marketplace, 1),
              encoding='utf-8',
          )

          setup = Path('SETUP.md')
          setup_text = setup.read_text(encoding='utf-8')
          replacements = {
              '- [Claude Code](https://claude.ai/download) - Uses `.claude/skills/` (full 17-skill native surface)':
                  '- [Claude Code](https://claude.ai/download) - Uses `.claude/skills/` + `.claude/agents/` (33 skills + 10 agents)',
              '   - [Kiro](https://kiro.dev/) - Uses `.kiro/powers/` (7 core native powers)':
                  '   - **Antigravity** - Uses `.agents/skills/` + `.agents/agents/` (33 skills + 10 agents)\n   - **Cursor** - Uses `.cursor-plugin/plugin.json` + `.cursorrules` (33 skills + 10 agents)\n   - [Kiro](https://kiro.dev/) - Uses `.kiro/powers/` (7 core native powers)',
              '  - `.claude/skills/` - 33 Claude Code skills (full surface)\n  - `.kiro/powers/` - 7 Kiro powers (core workflows)':
                  '  - `.claude/skills/` + `.claude/agents/` - 33 Claude Code skills + 10 agents\n  - `.agents/skills/` + `.agents/agents/` - 33 Antigravity skill stubs + 10 agent stubs\n  - `.cursor-plugin/plugin.json` + `.cursorrules` - Cursor package with 33 skills + 10 agents\n  - `plugin.json` + `skills/` - Agent Plugins 1.0.0 manifest + generated 33-skill mirror\n  - `.kiro/powers/` - 7 Kiro powers (core workflows)',
              '│   ├── agents/                # 6 worker agent definitions':
                  '│   ├── agents/                # 10 agents (6 workers + 4 verifiers)',
          }
          for old, new in replacements.items():
              if old not in setup_text:
                  raise SystemExit(f'SETUP marker not found: {old!r}')
              setup_text = setup_text.replace(old, new, 1)
          setup.write_text(setup_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          marker = 'All notable changes to COG (Cognition + Obsidian + Git) will be documented in this file.\n\n'
          if marker not in changelog_text:
              raise SystemExit('CHANGELOG insertion marker not found')
          entry = '''## [3.10.1] - 2026-08-07

          ### Fixed

          - Packaging validation now enforces exact Claude, Antigravity, and Cursor skill/agent parity, manifest paths, Agent Plugins mirror parity, updater coverage, and published-version consistency.
          - Restored the four verification/repair agents missing from `.cursor-plugin/plugin.json` since the 10-agent release.
          - `cog-update.sh` now preserves upstream executable bits and detects mode-only drift for tracked framework files.
          - `cog-update.sh` no longer exits after the first update or skip under `set -e` because counters now use errexit-safe arithmetic assignment.
          - Packaging documentation and Cursor guidance now match the shipped 33-skill, 10-agent surfaces.

          ### Added

          - GitHub Actions framework validation on pull requests and `main` pushes.
          - Regression coverage for Antigravity drift, Cursor agent drift, marketplace version drift, updater file modes, and multi-file force updates.

          '''
          if '## [3.10.1] - 2026-08-07' not in changelog_text:
              changelog_text = changelog_text.replace(marker, marker + entry, 1)
              changelog.write_text(changelog_text, encoding='utf-8')
          RELEASEPY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add COG-VERSION .claude-plugin/plugin.json .cursor-plugin/plugin.json plugin.json marketplace-entry.json .github/MARKETPLACE.md SETUP.md CHANGELOG.md
            git diff --cached --check
            git commit -m "chore: prepare v3.10.1 packaging fix"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Check Cursor agent parity
        run: bash tests/test-cursor-agent-parity.sh

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh
