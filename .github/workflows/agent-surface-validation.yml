name: Framework Validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Apply targeted updater counter fix
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cog-update.sh')
          text = path.read_text()

          marker = '  "tests/test-cog-update-mode-drift.sh"\n'
          addition = marker + '  "tests/test-cog-update-force.sh"\n'
          if '  "tests/test-cog-update-force.sh"\n' not in text:
              if marker not in text:
                  raise SystemExit('FRAMEWORK_FILES marker not found')
              text = text.replace(marker, addition, 1)

          updated_count = text.count('((updated++))')
          skipped_count = text.count('((skipped++))')
          if updated_count not in (0, 6) or skipped_count not in (0, 3):
              raise SystemExit(
                  f'unexpected counter occurrences: updated={updated_count} skipped={skipped_count}'
              )

          text = text.replace('((updated++))', 'updated=$((updated + 1))')
          text = text.replace('((skipped++))', 'skipped=$((skipped + 1))')
          path.write_text(text)
          PY

          if ! git diff --quiet -- cog-update.sh; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cog-update.sh
            git diff --cached --check
            git commit -m "fix: avoid errexit on updater counters"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh
