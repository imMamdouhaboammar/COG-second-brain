name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Prepare v3.10.2 runtime fix metadata
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'RELEASEPY'
          from pathlib import Path

          old_version = '3.10.1'
          new_version = '3.10.2'

          version_file = Path('COG-VERSION')
          if version_file.read_text(encoding='utf-8').strip() == old_version:
              version_file.write_text(new_version + '\n', encoding='utf-8')

          for name in (
              '.claude-plugin/plugin.json',
              '.cursor-plugin/plugin.json',
              'plugin.json',
              'marketplace-entry.json',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = f'"version": "{old_version}"'
              new = f'"version": "{new_version}"'
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          marketplace = Path('.github/MARKETPLACE.md')
          marketplace_text = marketplace.read_text(encoding='utf-8')
          old_marketplace = f'Current packaged version: **{old_version}**'
          new_marketplace = f'Current packaged version: **{new_version}**'
          if marketplace_text.count(old_marketplace) != 1:
              raise SystemExit('marketplace packaged-version marker not found exactly once')
          marketplace.write_text(
              marketplace_text.replace(old_marketplace, new_marketplace, 1),
              encoding='utf-8',
          )

          updater = Path('cog-update.sh')
          updater_text = updater.read_text(encoding='utf-8')
          marker = '  "tests/test-cursor-agent-parity.sh"\n'
          addition = marker + '  "tests/test-lane-classify.sh"\n'
          if '  "tests/test-lane-classify.sh"\n' not in updater_text:
              if marker not in updater_text:
                  raise SystemExit('cog-update test marker not found')
              updater_text = updater_text.replace(marker, addition, 1)
              updater.write_text(updater_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          insert_marker = 'All notable changes to COG (Cognition + Obsidian + Git) will be documented in this file.\n\n'
          entry = '''## [3.10.2] - 2026-08-07

          ### Fixed

          - `lane-classify.sh explain` now returns structured `lane`, `score`, and hard-gate reason output for security, bug, and backfill gates, matching the existing tiny-gate behavior.
          - `classify` output and hard-gate precedence remain unchanged.

          ### Added

          - Regression coverage for `classify` and `explain` output across all four hard-gate families.

          '''
          if '## [3.10.2] - 2026-08-07' not in changelog_text:
              if insert_marker not in changelog_text:
                  raise SystemExit('CHANGELOG insertion marker not found')
              changelog.write_text(
                  changelog_text.replace(insert_marker, insert_marker + entry, 1),
                  encoding='utf-8',
              )
          RELEASEPY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add COG-VERSION .claude-plugin/plugin.json .cursor-plugin/plugin.json plugin.json marketplace-entry.json .github/MARKETPLACE.md cog-update.sh CHANGELOG.md
            git diff --cached --check
            git commit -m "chore: prepare v3.10.2 lane classifier fix"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Check Cursor agent parity
        run: bash tests/test-cursor-agent-parity.sh

      - name: Test lane classifier hard gates
        run: bash tests/test-lane-classify.sh

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh
