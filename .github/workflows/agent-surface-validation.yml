name: Agent Surface Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run validator regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh
