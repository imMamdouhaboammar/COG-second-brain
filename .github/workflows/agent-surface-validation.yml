name: Framework Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Prepare v3.10.4 metadata
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_version = '3.10.3'
          new_version = '3.10.4'

          version_file = Path('COG-VERSION')
          current = version_file.read_text(encoding='utf-8').strip()
          if current == old_version:
              version_file.write_text(new_version + '\n', encoding='utf-8')
          elif current != new_version:
              raise SystemExit(f'unexpected COG-VERSION: {current}')

          for name in (
              '.claude-plugin/plugin.json',
              '.cursor-plugin/plugin.json',
              'plugin.json',
              'marketplace-entry.json',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = f'"version": "{old_version}"'
              new = f'"version": "{new_version}"'
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: expected one old version marker')
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'{name}: version marker not found')

          marketplace = Path('.github/MARKETPLACE.md')
          text = marketplace.read_text(encoding='utf-8')
          old = f'Current packaged version: **{old_version}**'
          new = f'Current packaged version: **{new_version}**'
          if old in text:
              marketplace.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('marketplace packaged version marker not found')

          updater = Path('cog-update.sh').read_text(encoding='utf-8')
          if '  "tests/test-harness-bootstrap-contract.sh"\n' not in updater:
              raise SystemExit('bootstrap regression is not tracked by FRAMEWORK_FILES')
          if '  "04-projects/harness/ultragoals.md"\n' in updater:
              raise SystemExit('mutable ultragoal registry must not be tracked by FRAMEWORK_FILES')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = 'All notable changes to COG (Cognition + Obsidian + Git) will be documented in this file.\n\n'
          entry = '''## [3.10.4] - 2026-08-07

### Fixed

- `/ultragoal status` now treats a missing registry as an empty read-only state instead of assuming `04-projects/harness/ultragoals.md` already exists.
- `/ultragoal new` now creates the mutable registry on first use and preserves existing registry rows.
- `WORKFLOW.md` no longer documents the nonexistent `.claude/lib/install-harness.sh` or missing harness backlog file.
- Harness validation documentation now points to commands that actually ship with the repository.

### Added

- Regression coverage for ultragoal registry bootstrap behavior, user-state protection from `cog-update.sh`, and dead static harness references.

'''
          if '## [3.10.4] - 2026-08-07' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG insertion marker missing')
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add COG-VERSION .claude-plugin/plugin.json .cursor-plugin/plugin.json plugin.json marketplace-entry.json .github/MARKETPLACE.md CHANGELOG.md
            git diff --cached --check
            git commit -m "chore: prepare v3.10.4 harness bootstrap fix"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run agent-surface regression tests
        run: bash tests/test-agent-surface-validator.sh

      - name: Check Cursor agent parity
        run: bash tests/test-cursor-agent-parity.sh

      - name: Test lane classifier hard gates
        run: bash tests/test-lane-classify.sh

      - name: Test checkpoint evidence integrity
        run: bash tests/test-checkpoint.sh

      - name: Check closed-loop harness assets
        run: bash tests/test-harness-assets.sh

      - name: Test harness bootstrap contract
        run: bash tests/test-harness-bootstrap-contract.sh

      - name: Test safe harness report rendering
        run: python3 tests/test-harness-report-renderer.py

      - name: Detect updater mode drift
        run: bash tests/test-cog-update-mode-drift.sh

      - name: Preserve updater executable modes
        run: bash tests/test-cog-update-file-mode.sh

      - name: Exercise force-mode multi-file updates
        run: bash tests/test-cog-update-force.sh

      - name: Validate packaged agent surfaces
        run: bash scripts/validate-agent-surface.sh
